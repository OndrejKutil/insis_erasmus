[project]
name = "insis-erasmus"
version = "0.1.0"
description = "Read VŠE InSIS Erasmus student reports (závěrečné zprávy) without clicking through them one by one."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["insis", "vse", "erasmus", "scraper"]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The package sits next to tests/ rather than being installed, so pytest needs
# telling where 'insis' is.
pythonpath = ["."]
testpaths = ["tests"]
